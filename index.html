<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La evolución de los modelos de datos · Infografía interactiva</title>

  <meta name="theme-color" content="#1b2540">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cellipse cx='32' cy='14' rx='22' ry='8' fill='%233a6fc4'/%3E%3Cpath d='M10 14v36c0 4.4 9.8 8 22 8s22-3.6 22-8V14c0 4.4-9.8 8-22 8s-22-3.6-22-8z' fill='%23111'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Manrope:wght@400;500;600;700;800&family=Tinos&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=6">
  <link rel="stylesheet" href="css/redesign.css?v=6">
  <link rel="stylesheet" href="css/v6.css?v=6">
</head>
<body>
  <div class="desk" aria-hidden="true"><i class="aur aur--a"></i><i class="aur aur--b"></i><canvas id="particles"></canvas></div>

  <main class="stagewrap">
    <!-- La hoja: mismas medidas que el diseño de Canva (1536 × 2752) -->
    <article class="sheet" id="sheet" aria-label="Infografía: La evolución de los modelos de datos">
      <div class="sheet__inner" id="sheet-inner"></div>
    </article>
  </main>

  <!-- Barra de herramientas flotante -->
  <nav class="toolbar" aria-label="Controles de la infografía">
    <button type="button" class="tool" id="t-fit" aria-pressed="false" title="Ver la hoja completa en pantalla">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span>Hoja completa</span>
    </button>
    <button type="button" class="tool" id="t-replay" title="Repetir la animación">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4"/></svg>
      <span>Repetir</span>
    </button>
    <button type="button" class="tool" id="t-credits" title="Autor y fuentes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/></svg>
      <span>Créditos</span>
    </button>
    <a class="tool" href="assets/infografia-original.jpg" download title="Descargar la infografía original">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>
      <span>Descargar</span>
    </a>
  </nav>

  <div class="tip" id="tip" role="tooltip" hidden></div>

  <!-- Ficha de información -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <article class="modal__card" role="dialog" aria-modal="true" aria-labelledby="m-title" tabindex="-1">
      <button class="modal__close" type="button" data-close aria-label="Cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="modal__grab" aria-hidden="true"></div>
      <div id="m-body"></div>
    </article>
  </div>

  <script src="js/data.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
